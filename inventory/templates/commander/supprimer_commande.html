{% extends "basefonctionnaire.html" %}


{% block title %} Supprimer la commande {% endblock title %}


{% block content %}

    <form method="post" >

        {% csrf_token %}

        <fieldset class="form-group">
            <div style="color:#575757; font-style: bold; font-size: 3rem; border-bottom: 1px solid white;">Supprimer la commande</div> <br>
            <h2 style="color:#575757;">Êtes-vous sûr de vouloir supprimer cette commande ?</h2>
        </fieldset>
        <div class="form-group ">
            <input type="hidden" name="quantite" >
        </div>
        <div class="form-group">
            <input style="background-color:red;border-color:red" type="submit" class="btn btn-success" value="{{ savebtn }}" >
            <a href="{% url 'inventory' %}" class="btn btn-secondary">Annuler</a>
        </div>

    </form>

{% endblock content %}
