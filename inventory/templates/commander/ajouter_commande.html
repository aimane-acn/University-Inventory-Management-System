{% extends "basefonctionnaire.html" %}


{% block title %} {{title}} {% endblock title %}



{% block content %}
<div class="align-middle" style="color:#4b0082;font-weight:bold;text-decoration:underline;font-style: bold; font-size: 3rem; border-bottom: 1px solid white;">{{title}}</div>
<div >

    <a style="float:right;" href="{% url 'new-besion'%}" class="btn btn-success">Exprimer un besion</a>

</div>

  <br>
<form id="commandeForm" method="post">
    {% csrf_token %}

    <style>
    /* Style for the form group */
    .form-group {
        margin-bottom: 20px; /* Add some space between form groups */
    }

    /* Style for the labels */
    label {
        font-weight: bold; /* Make labels bold */
        color: #333; /* Set label color */
        font-size: 1.6em;

    }

    /* Style for the select input */
    select.textinput {
        width: 100%; /* Make select input full width */
        padding: 8px; /* Add padding */
        font-size: 14px; /* Set font size */
        border: 1px solid #ccc; /* Add border */
        border-radius: 5px; /* Add border radius */
        box-sizing: border-box; /* Ensure padding and border are included in width */
    }

    /* Style for the number input */
    input[type="number"].textinput {
        width: 100%; /* Make number input full width */
        padding: 8px; /* Add padding */
        font-size: 14px; /* Set font size */
        border: 1px solid #ccc; /* Add border */
        border-radius: 5px; /* Add border radius */
        box-sizing: border-box; /* Ensure padding and border are included in width */
    }

    /* Style for the error message */
    p.error {
        color: red; /* Set error message color */
        margin-top: 5px; /* Add space above error message */
    }
</style>

<div id="products">
    <div class="form-group">
        <label for="nom">Nom:</label>
        <select name="produit_id[]" class="textinput form-control">
            {% for stock in stocks %}
                {% if stock.quantity_produit > stock.Min %}
                    <option value="{{ stock.id }}">{{ stock.name_produit }}</option>
                {% endif %}
            {% endfor %}
        </select>
        <label for="quantite">Quantité:</label>
        <input type="number" name="quantite[]" placeholder="Quantité" value="{{ request.POST.quantite }}" required class="textinput" >
        {% if error %}
            <p class="error">{{error}}</p>
        {% endif  %}
    </div>
</div>

<button type="button" id="addProduct" class="btn btn-primary">Ajouter un produit</button>

<div style="float:right;" class="align-middle">
    <button type="submit"  class="btn btn-success">{{ savebtn }}</button>
    <a href="{% url 'inventory' %}" class="btn btn-secondary">Annuler</a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var addProductButton = document.getElementById("addProduct");
        var productsDiv = document.getElementById("products");

        addProductButton.addEventListener("click", function() {
            var newProductDiv = document.createElement("div");
            newProductDiv.classList.add("form-group");
            newProductDiv.innerHTML = `
                <label for="nom">Nom:</label>
                <select name="produit_id[]" class="textinput form-control">
                    {% for stock in stocks %}
                        {% if stock.quantity_produit > stock.Min %}
                            <option value="{{ stock.id }}">{{ stock.name_produit }}</option>
                        {% endif %}
                {% endfor %}
                </select>
                <label for="quantite">Quantité:</label>
                <input type="number" name="quantite[]" placeholder="Quantité" required class="textinput">
                <button style="margin-top: 10px;" type="button" class="btn btn-danger removeProduct">Supprimer</button>
            `;
            productsDiv.appendChild(newProductDiv);
        });

        // Gestionnaire d'événement pour supprimer un produit
        productsDiv.addEventListener("click", function(event) {
            if (event.target.classList.contains("removeProduct")) {
                var productToRemove = event.target.parentElement;
                productsDiv.removeChild(productToRemove);
            }
        });
    });
</script>


    <br>



{% endblock content %}
