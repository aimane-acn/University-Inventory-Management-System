{% extends "basemagasinier.html" %}


{% block title %} Delete Stock {% endblock title %}


{% block content %}
                
    <form method="post">
        
        {% csrf_token %}
        
        <fieldset class="form-group">
            <div style="color:#575757; font-style: bold; font-size: 3rem; border-bottom: 1px solid white;">Supprimer le produit</div> <br>
            <h2 style="color:#575757;">Êtes-vous sûr de vouloir supprimer ce produit ?</h2>
        </fieldset>

        <div class="form-group">  
            <button type="submit" class="btn btn-danger">Oui, supprimer</button>
            <a href="{% url 'list_produit' %}" class="btn btn-secondary">Annuler</a>
        </div>
        
    </form>

{% endblock content %}
